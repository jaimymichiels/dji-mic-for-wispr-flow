<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 436" width="880" height="436" role="img" aria-labelledby="how-it-works-title how-it-works-desc">
  <title id="how-it-works-title">Why only the DJI button becomes F18</title>
  <desc id="how-it-works-desc">The DJI receiver and your keyboard both send the same Volume Up key. In the macOS HID layer, which still knows which device sent a key, hidutil remaps Volume Up to F18 on the DJI receiver only. Below that layer apps only see the key, so Hammerspoon catches F18 and opens a Wispr Flow link, while the keyboard's Volume Up still changes the system volume.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .strong { font-weight: 600; }
    .bg { fill: #f7f8fa; }
    .band { fill: #eaeef5; }
    .card { fill: #ffffff; stroke: #d5dae0; stroke-width: 1; }
    .ink { fill: #1b1f24; }
    .muted { fill: #5e6773; }
    .eyebrow { fill: #5e6773; font-size: 11.5px; font-weight: 600; letter-spacing: 0.08em; }
    .line { stroke: #6b7580; stroke-width: 1.5; fill: none; }
    .arrowhead { fill: #6b7580; }
    .remap-box { fill: #eef2ff; stroke: #3e63dd; stroke-width: 1.75; }
    .remap { fill: #3451b2; }
    .remap-line { stroke: #3e63dd; stroke-width: 2; fill: none; }
    .arrowhead-remap { fill: #3e63dd; }
    .boundary { stroke: #e5484d; stroke-width: 1.5; stroke-dasharray: 7 6; }
    .boundary-text { fill: #c7353a; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f1318; }
      .band { fill: #151b24; }
      .card { fill: #171c22; stroke: #2d343c; }
      .ink { fill: #e6eaef; }
      .muted, .eyebrow { fill: #9aa4af; }
      .line { stroke: #8a939e; }
      .arrowhead { fill: #8a939e; }
      .remap-box { fill: #1a2140; stroke: #849dff; }
      .remap { fill: #9db1ff; }
      .remap-line { stroke: #849dff; }
      .arrowhead-remap { fill: #849dff; }
      .boundary { stroke: #ff6369; }
      .boundary-text { fill: #ff7b80; }
    }
  </style>
  <defs>
    <marker id="how-it-works-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto">
      <path class="arrowhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="how-it-works-arrow-remap" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path class="arrowhead-remap" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" width="880" height="436" rx="16"/>
  <rect class="band" x="16" y="118" width="848" height="106" rx="10"/>

  <!-- layer labels -->
  <text class="eyebrow" x="32" y="64">DEVICES</text>
  <text class="eyebrow" x="32" y="170">HID LAYER</text>
  <text class="muted" x="32" y="188" font-size="12">where hidutil works</text>
  <text class="boundary-text" x="32" y="236" font-size="12.5">▲ knows which device</text>
  <text class="boundary-text" x="32" y="264" font-size="12.5">▼ only sees the key</text>
  <text class="eyebrow" x="32" y="312">APPS</text>

  <line class="boundary" x1="16" y1="248" x2="864" y2="248"/>

  <!-- DJI lane -->
  <rect class="card" x="280" y="34" width="220" height="50" rx="10"/>
  <text class="ink strong" x="390" y="56" text-anchor="middle" font-size="14.5">DJI Mic receiver</text>
  <text class="muted" x="390" y="74" text-anchor="middle" font-size="12.5">plugged in over USB-C</text>
  <line class="line" x1="390" y1="84" x2="390" y2="134" marker-end="url(#how-it-works-arrow)"/>
  <text class="ink mono" x="400" y="113" font-size="12.5">Volume Up</text>

  <rect class="remap-box" x="280" y="138" width="220" height="70" rx="10"/>
  <text class="remap strong" x="390" y="160" text-anchor="middle" font-size="14.5">hidutil remap</text>
  <text class="ink mono" x="390" y="180" text-anchor="middle" font-size="13">Volume Up → F18</text>
  <text class="muted" x="390" y="198" text-anchor="middle" font-size="12">on this device only</text>
  <line class="remap-line" x1="390" y1="208" x2="390" y2="280" marker-end="url(#how-it-works-arrow-remap)"/>
  <text class="remap mono strong" x="400" y="276" font-size="13">F18</text>

  <rect class="card" x="280" y="284" width="220" height="50" rx="10"/>
  <text class="ink strong" x="390" y="306" text-anchor="middle" font-size="14.5">Hammerspoon</text>
  <text class="muted mono" x="390" y="324" text-anchor="middle" font-size="12">hs.hotkey F18</text>
  <line class="remap-line" x1="390" y1="334" x2="390" y2="372" marker-end="url(#how-it-works-arrow-remap)"/>
  <text class="remap mono" x="400" y="357" font-size="12.5">wispr-flow:// link</text>

  <rect class="card" x="280" y="376" width="220" height="44" rx="10"/>
  <text class="ink strong" x="390" y="396" text-anchor="middle" font-size="14.5">Wispr Flow</text>
  <text class="muted" x="390" y="412" text-anchor="middle" font-size="12">starts or stops dictation</text>

  <!-- keyboard lane -->
  <rect class="card" x="580" y="34" width="220" height="50" rx="10"/>
  <text class="ink strong" x="690" y="56" text-anchor="middle" font-size="14.5">Your keyboard</text>
  <text class="muted" x="690" y="74" text-anchor="middle" font-size="12.5">its volume key</text>
  <line class="line" x1="690" y1="84" x2="690" y2="134" marker-end="url(#how-it-works-arrow)"/>
  <text class="ink mono" x="700" y="113" font-size="12.5">Volume Up</text>

  <rect class="card" x="580" y="138" width="220" height="70" rx="10"/>
  <text class="ink strong" x="690" y="168" text-anchor="middle" font-size="14.5">No remap</text>
  <text class="muted" x="690" y="188" text-anchor="middle" font-size="12.5">passes through unchanged</text>
  <line class="line" x1="690" y1="208" x2="690" y2="280" marker-end="url(#how-it-works-arrow)"/>
  <text class="ink mono" x="700" y="276" font-size="12.5">Volume Up</text>

  <rect class="card" x="580" y="284" width="220" height="50" rx="10"/>
  <text class="ink strong" x="690" y="306" text-anchor="middle" font-size="14.5">System volume</text>
  <text class="muted" x="690" y="324" text-anchor="middle" font-size="12">goes up, as usual</text>
</svg>
